[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-event-platform"
version = "0.1.0"
description = "Real-time inventory event platform: Flask, Pub/Sub, Cloud Run and BigQuery."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.urls]
Repository = "https://github.com/fedex85/event-processing-platform"

[project.optional-dependencies]
api = [
    "google-cloud-pubsub>=2.23,<3",
    "google-cloud-bigquery>=3.25,<4",
]
processor = [
    "google-cloud-bigquery>=3.25,<4",
]
dev = [
    "inventory-event-platform[api,processor]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["api*", "processor*", "common*", "simulator*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "processor/tests", "common/tests", "simulator/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["api", "processor", "common", "simulator"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
files = ["api", "processor", "common", "simulator"]

# The ``google.cloud`` namespace package ships without a py.typed marker, so mypy
# cannot analyze the import in api/publishers/pubsub.py. The adapter treats the
# client as ``Any`` on purpose; its tests use a fake client.
[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
